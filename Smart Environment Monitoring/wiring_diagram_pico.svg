<text x="1298" y="631" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">GND</text>
<line x1="1160" y1="575" x2="1380" y2="575" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
<text x="1270" y="562" font-size="16" text-anchor="middle" fill="#7c3aed" font-weight="700">GP13 &#8594; I/O</text>
<text x="1540" y="725" font-size="17" text-anchor="middle" fill="#5b6b64" font-weight="400">Bare 2-pin buzzer: + to GP13, - to GND</text>
<text x="130" y="850" font-size="20" text-anchor="start" fill="#17251f" font-weight="700">Wire colours</text>
<line x1="130" y1="879" x2="190" y2="879" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="885" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">3V3 power (all VCC pins)</text>
<line x1="130" y1="909" x2="190" y2="909" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="915" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">GND (all GND pins)</text>
<line x1="130" y1="939" x2="190" y2="939" stroke="#d99a00" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="945" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">DHT11 DATA to GP15</text>
<line x1="130" y1="969" x2="190" y2="969" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="975" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">BH1750 SCL to GP5</text>
<line x1="130" y1="999" x2="190" y2="999" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="1005" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">BH1750 SDA to GP4</text>
<line x1="130" y1="1029" x2="190" y2="1029" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="1035" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">LED signal GP14 via 220 &#937;</text>
<line x1="130" y1="1059" x2="190" y2="1059" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
<text x="205" y="1065" font-size="18" text-anchor="start" fill="#17251f" font-weight="400">Buzzer signal GP13</text>
<rect x="1200" y="780" width="680" height="290" rx="12" fill="#f4f7f5" stroke="#9aa9a1" stroke-width="2"/>
<text x="1220" y="815" font-size="21" text-anchor="start" fill="#17251f" font-weight="700">Notes</text>
<text x="1220" y="852" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">1. 3V3 tags: breadboard + rail. GND tags: - rail.</text>
<text x="1220" y="881" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">2. Join the two rails to Pico pin 36 (3V3 OUT) and a GND pin.</text>
<text x="1220" y="910" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">3. Count pins from the USB end: left side 1-20, right side 21-40.</text>
<text x="1220" y="939" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">4. DHT11 pin order varies: follow its S / + / - marks.</text>
<text x="1220" y="968" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">5. BH1750: leave ADDR unconnected (I2C address 0x23).</text>
<text x="1220" y="997" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">6. Buzzer always on? Active-LOW: swap BUZZER_ON / OFF.</text>
<text x="1220" y="1026" font-size="17" text-anchor="start" fill="#17251f" font-weight="400">7. Power over micro-USB. Sensors use 3V3, never 5 V.</text>
</svg>