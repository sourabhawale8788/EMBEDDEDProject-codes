<text x="1445" y="352" font-size="15" text-anchor="middle" fill="#5b6b64" font-weight="400">long leg (+) on the resistor side</text>
<rect x="1380" y="450" width="320" height="240" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/>
<text x="1540.0" y="486" font-size="22" text-anchor="middle" fill="#17251f" font-weight="700">Buzzer module</text>
