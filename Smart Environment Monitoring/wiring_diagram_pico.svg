<circle cx="1380" cy="525" r="6" fill="#111827"/>
<text x="1395" y="581" font-size="19" text-anchor="start" fill="#17251f" font-weight="400">I/O</text>
<circle cx="1380" cy="575" r="6" fill="#111827"/>
<text x="1395" y="631" font-size="19" text-anchor="start" fill="#17251f" font-weight="400">GND</text>
<circle cx="1380" cy="625" r="6" fill="#111827"/>
<line x1="1380" y1="525" x2="1330" y2="525" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<rect x="1266" y="511" width="64" height="28" rx="14" fill="#dc2626"/>
